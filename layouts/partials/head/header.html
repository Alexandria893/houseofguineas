<header id="header">
    <div id="head" class="parallax" data-parallax-speed="2"
        style="background-image:url('{{ .Site.BaseURL }}{{ .Site.Params.banner }}');">
        <div class="hero-overlay"></div>
        <div class="hero-content text-center">
            <img class='img-{{ .Site.Params.avatarclass | default "circle"}}'
                src="{{ .Site.BaseURL }}{{ .Site.Params.avatar }}" alt="{{ .Site.Params.name }}">
            <h1 class="hero-title">{{ .Site.Params.name }}</h1>
            <p class="hero-tagline">{{ .Site.Params.description }}</p>
            <div class="hero-cta">
                <a href="tel:{{ .Site.Params.phone }}" class="btn btn-lg btn-cta-hero">
                    Let's Discuss the Best Care for Your Pet
                </a>
            </div>
        </div>
    </div>

    {{ partial "head/menu.html" . }}
</header>
