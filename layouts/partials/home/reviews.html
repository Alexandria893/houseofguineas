
<div class="row">
  {{ range where .Data.Pages "Section" .Section }}
    <div class="col-sm-6 col-md-4">
      <div class="review-card">
        <h3 class="review-author">{{ .Title }}</h3>
        {{ if .Truncated }}
        <details class="review-expandable">
          <summary>
            <div class="review-quote">{{ .Summary }}</div>
            <span class="review-toggle-open">Read full review</span>
            <span class="review-toggle-close">Close review</span>
          </summary>
          <div class="review-full">{{ .Content }}</div>
        </details>
        {{ else }}
        <div class="review-quote">{{ .Content }}</div>
        {{ end }}
      </div>
    </div>
  {{ end }}
</div>
