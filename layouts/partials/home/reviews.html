
<div class="row">
  {{ range where .Data.Pages "Section" .Section }}
    <div class="col-sm-6 col-md-4">
      <div class="review-card">
        <h3 class="review-author">{{ .Title }}</h3>
        {{ if .Truncated }}
        <div class="review-quote">{{ .Summary }}</div>
        <details>
          <summary>Read full review</summary>
          <div class="review-full">{{ .Content }}</div>
        </details>
        {{ else }}
        <div class="review-quote">{{ .Content }}</div>
        {{ end }}
      </div>
    </div>
  {{ end }}
</div>
