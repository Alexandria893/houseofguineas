<nav class="mobile-nav" aria-label="Mobile navigation">
  <div class="mobile-nav__scroll">
    <a href="/" class="mobile-nav__link{{ if .IsHome }} mobile-nav__link--active{{ end }}">Home</a>
    <div class="mobile-nav__dropdown">
      <button type="button" class="mobile-nav__link mobile-nav__link--parent{{ if or (eq .RelPermalink "/home/services/exotic-pet-care-services-in-home/") (eq .RelPermalink "/home/services/exotic-pet-care-services-boarding/") }} mobile-nav__link--active{{ end }}" aria-expanded="false">Services <i class="fa-solid fa-chevron-down mobile-nav__caret"></i></button>
      <div class="mobile-nav__dropdown-menu">
        <a href="/home/services/exotic-pet-care-services-in-home/" class="mobile-nav__dropdown-item">In-Home</a>
        <a href="/home/services/exotic-pet-care-services-boarding/" class="mobile-nav__dropdown-item">Boarding</a>
      </div>
    </div>
    <a href="/about/" class="mobile-nav__link{{ if eq .RelPermalink "/about/" }} mobile-nav__link--active{{ end }}">About</a>
    <div class="mobile-nav__dropdown">
      <button type="button" class="mobile-nav__link mobile-nav__link--parent{{ if or (eq .RelPermalink "/home/services/faqs/") (eq .RelPermalink "/small-mammal-resources/") (eq .RelPermalink "/san-francisco-bay-area-exotic-veterinarians/") (eq .RelPermalink "/san-francisco-california-exotic-veterinary-experience/") }} mobile-nav__link--active{{ end }}" aria-expanded="false">Resources <i class="fa-solid fa-chevron-down mobile-nav__caret"></i></button>
      <div class="mobile-nav__dropdown-menu">
        <a href="/home/services/faqs/" class="mobile-nav__dropdown-item">FAQs</a>
        <a href="/small-mammal-resources/" class="mobile-nav__dropdown-item">Small Pet Resources</a>
        <a href="/san-francisco-bay-area-exotic-veterinarians/" class="mobile-nav__dropdown-item">Local Vets</a>
        <a href="/san-francisco-california-exotic-veterinary-experience/" class="mobile-nav__dropdown-item">Vet Experience</a>
      </div>
    </div>
  </div>
</nav>

<script>
(function() {
  document.addEventListener('click', function(e) {
    var toggle = e.target.closest('.mobile-nav__link--parent');
    if (toggle) {
      e.preventDefault();
      var dropdown = toggle.closest('.mobile-nav__dropdown');
      var isOpen = dropdown.classList.contains('open');
      // Close all open dropdowns first
      document.querySelectorAll('.mobile-nav__dropdown.open').forEach(function(d) {
        d.classList.remove('open');
        d.querySelector('.mobile-nav__link--parent').setAttribute('aria-expanded', 'false');
      });
      // Toggle the tapped one
      if (!isOpen) {
        dropdown.classList.add('open');
        toggle.setAttribute('aria-expanded', 'true');
      }
    } else if (!e.target.closest('.mobile-nav__dropdown-menu')) {
      // Clicked outside dropdown — close all
      document.querySelectorAll('.mobile-nav__dropdown.open').forEach(function(d) {
        d.classList.remove('open');
        d.querySelector('.mobile-nav__link--parent').setAttribute('aria-expanded', 'false');
      });
    }
  });
})();
</script>
