    <a href="/routine-recurring-exotic-pet-care/" class="mobile-nav__link{{ if eq .RelPermalink "/routine-recurring-exotic-pet-care/" }} mobile-nav__link--active{{ end }}">Routine Care</a>
    <div class="mobile-nav__dropdown">
      <button type="button" class="mobile-nav__link mobile-nav__link--parent{{ if or (eq .RelPermalink "/about/") (eq .RelPermalink "/san-francisco-california-exotic-veterinary-experience/") }} mobile-nav__link--active{{ end }}" aria-expanded="false">About <i class="fa-solid fa-chevron-down mobile-nav__caret"></i></button>
      <div class="mobile-nav__dropdown-menu">
        <a href="/about/" class="mobile-nav__dropdown-item">About Alexandria</a>

    </div>
    <a href="/post/" class="mobile-nav__link{{ if eq .Section "post" }} mobile-nav__link--active{{ end }}">Blog</a>

      <button type="button" class="mobile-nav__link mobile-nav__link--parent{{ if or (eq .RelPermalink "/resources/") (eq .RelPermalink "/clinical-series-guinea-pig-fleece-cage-liners/") (eq .RelPermalink "/san-francisco-bay-area-exotic-veterinarians/") (eq .RelPermalink "/san-mateo-peninsula-exotic-veterinarians/") }} mobile-nav__link--active{{ end }}" aria-expanded="false">Resources <i class="fa-solid fa-chevron-down mobile-nav__caret"></i></button>

</nav>

<script>
(function() {
  function positionDropdown(dropdown) {
    var menu = dropdown.querySelector('.mobile-nav__dropdown-menu');
    var nav = document.querySelector('.mobile-nav');
    if (nav && menu) {
      menu.style.top = nav.getBoundingClientRect().bottom + 'px';
    }
  }

  document.addEventListener('click', function(e) {
    var toggle = e.target.closest('.mobile-nav__link--parent');
    if (toggle) {
      e.preventDefault();
      var dropdown = toggle.closest('.mobile-nav__dropdown');
      var isOpen = dropdown.classList.contains('open');
      // Close all open dropdowns first
      document.querySelectorAll('.mobile-nav__dropdown.open').forEach(function(d) {
        d.classList.remove('open');
        d.querySelector('.mobile-nav__link--parent').setAttribute('aria-expanded', 'false');
      });
      // Toggle the tapped one
      if (!isOpen) {
        dropdown.classList.add('open');
        toggle.setAttribute('aria-expanded', 'true');
        positionDropdown(dropdown);
      }
    } else if (!e.target.closest('.mobile-nav__dropdown-menu')) {
      // Clicked outside dropdown — close all
      document.querySelectorAll('.mobile-nav__dropdown.open').forEach(function(d) {
        d.classList.remove('open');
        d.querySelector('.mobile-nav__link--parent').setAttribute('aria-expanded', 'false');
      });
    }
  });
})();
</script>
