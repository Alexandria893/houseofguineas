<div class="cta-section">
    <div class="col-sm-8 col-sm-offset-2 text-center">
        <h3>Ready to Schedule Your Free Meet &amp; Greet?</h3>
        <p>Give me a call or text, or send me an email to get started.</p>
        <p class="cta-buttons">
            <a href="tel:{{ .Site.Params.phone }}" class="btn btn-lg btn-cta-primary">
                Call or Text {{ .Site.Params.phone }}
            </a>
            <a href="mailto:{{ .Site.Params.email }}" class="btn btn-lg btn-cta-secondary">
                Send Me an Email
            </a>
        </p>
    </div>
</div>
