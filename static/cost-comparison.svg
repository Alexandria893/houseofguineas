<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 0 2000 2000" font-family="Helvetica, Arial, sans-serif">
  <rect width="2000" height="2000" fill="#F4F8F7"/>
  <!-- Header -->
  <rect width="2000" height="360" fill="#164E4A"/>
  <text x="1000" y="150" text-anchor="middle" fill="#8FD6CF" font-size="52" letter-spacing="14" font-weight="700">DO THE MATH</text>
  <text x="1000" y="258" text-anchor="middle" fill="#FFFFFF" font-size="112" font-weight="800">One purchase. 6+ years.</text>
  <text x="1000" y="322" text-anchor="middle" fill="#CDE7E3" font-size="40">The last guinea pig bedding you'll ever buy</text>

  <!-- Clinical Series card -->
  <rect x="110" y="450" width="820" height="1140" rx="28" fill="#FFFFFF" stroke="#14807A" stroke-width="6"/>
  <rect x="110" y="450" width="820" height="118" rx="28" fill="#14807A"/>
  <rect x="110" y="510" width="820" height="58" fill="#14807A"/>
  <text x="520" y="527" text-anchor="middle" fill="#FFFFFF" font-size="40" font-weight="700">HOUSE OF GUINEAS</text>
  <text x="520" y="545" text-anchor="middle" fill="#B8E6E1" font-size="30" letter-spacing="6" dy="18">CLINICAL SERIES</text>
  <text x="520" y="770" text-anchor="middle" fill="#0F3D3A" font-size="188" font-weight="800">$465</text>
  <text x="520" y="835" text-anchor="middle" fill="#14807A" font-size="46" font-weight="700" letter-spacing="8">ONE TIME</text>
  <text x="520" y="905" text-anchor="middle" fill="#3A5A57" font-size="42">≈ $78 / year over 6 years</text>
  <line x1="200" y1="950" x2="840" y2="950" stroke="#D5E6E4" stroke-width="3"/>
  <g fill="#26413F" font-size="40">
    <text x="230" y="1035">✓  All-in-one system (2 liners)</text>
    <text x="230" y="1120">✓  Antimicrobial silver-ion</text>
    <text x="230" y="1205">✓  Waterproof &amp; dust-free</text>
    <text x="230" y="1290">✓  Lasts 6+ years</text>
    <text x="230" y="1375">✓  Never buy bedding again</text>
    <text x="230" y="1460">✓  Handmade in San Francisco</text>
  </g>

  <!-- Disposable card -->
  <rect x="1070" y="450" width="820" height="1140" rx="28" fill="#F7F2F0" stroke="#C9BEB9" stroke-width="6"/>
  <rect x="1070" y="450" width="820" height="118" rx="28" fill="#7A6E68"/>
  <rect x="1070" y="510" width="820" height="58" fill="#7A6E68"/>
  <text x="1480" y="527" text-anchor="middle" fill="#FFFFFF" font-size="40" font-weight="700">PAPER / WOOD</text>
  <text x="1480" y="545" text-anchor="middle" fill="#E4DAD5" font-size="30" letter-spacing="6" dy="18">DISPOSABLE BEDDING</text>
  <text x="1480" y="765" text-anchor="middle" fill="#B23A2E" font-size="150" font-weight="800">$240–480</text>
  <text x="1480" y="835" text-anchor="middle" fill="#B23A2E" font-size="46" font-weight="800" letter-spacing="6">EVERY YEAR</text>
  <text x="1480" y="905" text-anchor="middle" fill="#6B5F59" font-size="42">…again next year, and the next</text>
  <line x1="1160" y1="950" x2="1800" y2="950" stroke="#E2D8D3" stroke-width="3"/>
  <g fill="#5C524D" font-size="40">
    <text x="1190" y="1035">✕  Recurring cost forever</text>
    <text x="1190" y="1120">✕  Dust &amp; ammonia buildup</text>
    <text x="1190" y="1205">✕  Traps moisture on paws</text>
    <text x="1190" y="1290">✕  Bumblefoot &amp; URI risk</text>
    <text x="1190" y="1375">✕  Weekly landfill waste</text>
    <text x="1190" y="1460">✕  Restock, restock, restock</text>
  </g>

  <!-- Bottom banner -->
  <rect x="110" y="1660" width="1780" height="250" rx="28" fill="#164E4A"/>
  <text x="1000" y="1770" text-anchor="middle" fill="#FFFFFF" font-size="66" font-weight="800">Pays for itself in ~1.5 years.</text>
  <text x="1000" y="1850" text-anchor="middle" fill="#8FD6CF" font-size="52" font-weight="600">After that, your bedding is free.</text>

  <text x="1000" y="1968" text-anchor="middle" fill="#3A5A57" font-size="38" letter-spacing="4">houseofguineas.com  ·  Vet-designed, medical-grade</text>
