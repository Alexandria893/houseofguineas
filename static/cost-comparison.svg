<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=Lora:wght@600;700&amp;display=swap');
      .title { font-family: 'Lora', Georgia, serif; font-weight: 700; fill: #3D3228; }
      .subtitle { font-family: 'Nunito', sans-serif; font-weight: 600; fill: #6B5E52; }
      .table-header { font-family: 'Nunito', sans-serif; font-weight: 700; fill: #FFFFFF; font-size: 16px; }
      .row-label { font-family: 'Nunito', sans-serif; font-weight: 700; fill: #3D3228; font-size: 15px; }
      .cell { font-family: 'Nunito', sans-serif; font-weight: 600; fill: #3D3228; font-size: 15px; }
      .highlight-label { font-family: 'Nunito', sans-serif; font-weight: 800; fill: #3D3228; font-size: 15px; }
      .highlight-cell { font-family: 'Nunito', sans-serif; font-weight: 800; fill: #557259; font-size: 15px; }
      .footnote { font-family: 'Nunito', sans-serif; font-weight: 400; fill: #6B5E52; font-size: 12px; }
      .badge-text { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; }
      .big-number { font-family: 'Lora', Georgia, serif; font-weight: 700; font-size: 32px; }
      .big-label { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; }
      .tagline { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 16px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="900" rx="16" fill="#FAF8F5"/>

  <!-- Header -->
  <text x="400" y="70" text-anchor="middle" class="title" font-size="24" letter-spacing="1">UNDERSTAND THE REAL COST</text>
  <text x="400" y="105" text-anchor="middle" class="title" font-size="24" letter-spacing="1">OF YOUR CURRENT SETUP</text>

  <!-- Table -->
  <!-- Header row -->
  <rect x="50" y="140" width="700" height="44" rx="8" fill="#6B5E52"/>
  <text x="195" y="167" text-anchor="middle" class="table-header">Bedding Type</text>
  <text x="390" y="167" text-anchor="middle" class="table-header">Year 1</text>
  <text x="520" y="167" text-anchor="middle" class="table-header">Year 2</text>
  <text x="670" y="167" text-anchor="middle" class="table-header">Year 5</text>

  <!-- Divider lines -->
  <line x1="330" y1="145" x2="330" y2="180" stroke="#FAF8F5" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="455" y1="145" x2="455" y2="180" stroke="#FAF8F5" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="590" y1="145" x2="590" y2="180" stroke="#FAF8F5" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Row 1: Paper Bedding -->
  <rect x="50" y="184" width="700" height="50" fill="#FFFFFF"/>
  <rect x="50" y="184" width="700" height="50" fill="#3D3228" fill-opacity="0.03"/>
  <text x="70" y="214" class="row-label">Paper Bedding</text>
  <text x="195" y="206" text-anchor="end" class="row-label" font-size="11" fill="#6B5E52">est. $40/mo</text>
  <text x="390" y="214" text-anchor="middle" class="cell">$480</text>
  <text x="520" y="214" text-anchor="middle" class="cell">$960</text>
  <text x="670" y="214" text-anchor="middle" class="cell" font-weight="800" fill="#B91C1C">$2,400</text>
  <line x1="50" y1="234" x2="750" y2="234" stroke="#E2D9CE" stroke-width="1"/>

  <!-- Row 2: Wood Shavings -->
  <rect x="50" y="234" width="700" height="50" fill="#FFFFFF"/>
  <text x="70" y="264" class="row-label">Wood Shavings</text>
  <text x="195" y="256" text-anchor="end" class="row-label" font-size="11" fill="#6B5E52">est. $25/mo</text>
  <text x="390" y="264" text-anchor="middle" class="cell">$300</text>
  <text x="520" y="264" text-anchor="middle" class="cell">$600</text>
  <text x="670" y="264" text-anchor="middle" class="cell" font-weight="800" fill="#B91C1C">$1,500</text>
  <line x1="50" y1="284" x2="750" y2="284" stroke="#E2D9CE" stroke-width="1"/>

  <!-- Row 3: Fleece Liners (Basic) -->
  <rect x="50" y="284" width="700" height="50" fill="#FFFFFF"/>
  <rect x="50" y="284" width="700" height="50" fill="#3D3228" fill-opacity="0.03"/>
  <text x="70" y="314" class="row-label">Fleece Liners (Basic)*</text>
  <text x="245" y="306" text-anchor="end" class="row-label" font-size="11" fill="#6B5E52">est. $80/yr</text>
  <text x="390" y="314" text-anchor="middle" class="cell">$80</text>
  <text x="520" y="314" text-anchor="middle" class="cell">$160</text>
  <text x="670" y="314" text-anchor="middle" class="cell">$400</text>
  <line x1="50" y1="334" x2="750" y2="334" stroke="#E2D9CE" stroke-width="1"/>

  <!-- Row 4: Clinical Series (highlighted) -->
  <rect x="50" y="334" width="700" height="56" rx="0 0 8 8" fill="#EFF6F0"/>
  <rect x="50" y="334" width="4" height="56" fill="#6B8F71"/>
  <text x="70" y="367" class="highlight-label" font-size="16">Clinical Series Liners</text>
  <text x="390" y="367" text-anchor="middle" class="highlight-cell" font-size="16">$315</text>
  <text x="520" y="367" text-anchor="middle" class="highlight-cell" font-size="16">$315</text>
  <text x="670" y="367" text-anchor="middle" class="highlight-cell" font-size="16">$315</text>

  <!-- Footnote -->
  <text x="400" y="418" text-anchor="middle" class="footnote">*Basic fleece liners require separate waterproof bases and absorbent pads, which adds hidden costs.</text>

  <!-- Comparison boxes -->
  <!-- Left box: Recurring -->
  <rect x="50" y="450" width="340" height="200" rx="12" fill="#FFFFFF" stroke="#E2D9CE" stroke-width="1.5"/>
  <rect x="120" y="465" width="200" height="30" rx="15" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="220" y="485" text-anchor="middle" class="badge-text" fill="#B91C1C">RECURRING ANNUAL COST ↑</text>
  <text x="220" y="535" text-anchor="middle" class="big-number" fill="#B91C1C">$2,400+</text>
  <text x="220" y="560" text-anchor="middle" class="big-label" fill="#3D3228">TOTAL COST OVER 5 YEARS</text>
  <text x="220" y="580" text-anchor="middle" class="footnote">(Paper bedding at $40/mo)</text>
  <text x="220" y="625" text-anchor="middle" class="tagline" fill="#B91C1C">Recurring monthly drain.</text>

  <!-- Right box: One-time -->
  <rect x="410" y="450" width="340" height="200" rx="12" fill="#FFFFFF" stroke="#6B8F71" stroke-width="1.5"/>
  <rect x="480" y="465" width="200" height="30" rx="15" fill="#EFF6F0" stroke="#6B8F71" stroke-width="1.5"/>
  <text x="580" y="485" text-anchor="middle" class="badge-text" fill="#557259">✓ LIFETIME INVESTMENT</text>
  <text x="580" y="535" text-anchor="middle" class="big-number" fill="#557259">$315</text>
  <text x="580" y="560" text-anchor="middle" class="big-label" fill="#3D3228">TOTAL COST — FOREVER</text>
  <text x="580" y="580" text-anchor="middle" class="footnote">(6+ year lifespan, includes 2 liners)</text>
  <text x="580" y="625" text-anchor="middle" class="tagline" fill="#557259">One-time investment.</text>

  <!-- Bottom section -->
  <rect x="50" y="680" width="700" height="90" rx="12" fill="#6B8F71"/>
  <text x="400" y="712" text-anchor="middle" font-family="Lora, Georgia, serif" font-weight="700" font-size="20" fill="#FFFFFF">The Only All-in-One Guinea Pig Fleece Liner</text>
  <text x="400" y="740" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="400" font-size="14" fill="rgba(255,255,255,0.9)">Entirely medical-grade. Fully antimicrobial. Pre-activated. No separate pads or bases needed.</text>

  <!-- Bottom tagline -->
  <text x="400" y="810" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="600" font-size="13" fill="#6B5E52">houseofguineas.com</text>
  <text x="400" y="830" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="400" font-size="11" fill="#6B5E52">Handmade in San Francisco — SF Engineered | Silver-Ion Technology</text>
</svg>